[settings]
lockfile = true

[tools]
xcodegen = "2.46.0"

[tasks.generate]
description = "Generate Clove.xcodeproj from project.yml"
run = "./scripts/generate-xcodeproj.sh"

[tasks.lint]
description = "Lint Swift sources with swift-format"
run = "swift format lint --strict --recursive --configuration .swift-format Clove CloveLab CloveTests CloveUITests Packages"

[tasks.format]
description = "Format Swift sources in place with swift-format"
run = "swift format format --in-place --recursive --configuration .swift-format Clove CloveLab CloveTests CloveUITests Packages"

[tasks.test-core]
description = "Run CloveCore package tests on macOS"
run = "swift test --package-path Packages/CloveCore"

[tasks.test-imaging]
description = "Run CloveImaging package tests on macOS"
run = "swift test --package-path Packages/CloveImaging"

[tasks.test-lab]
description = "Run the CloveLabKit package tests on macOS"
run = "swift test --package-path Packages/CloveLabKit"

[tasks.test-fixtures]
description = "Run the fixture tooling tests (logic only, no network)"
run = "/usr/bin/python3 scripts/test_fixtures.py"

[tasks.test-release]
description = "Run the TestFlight release tests (logic only, no network, no signing)"
run = "/usr/bin/python3 scripts/test_release_testflight.py"

[tasks.release]
description = "Archive, sign, validate, and optionally upload Clove or Clove Lab to TestFlight"
run = "/usr/bin/python3 scripts/release-testflight.py"

[tasks.fixtures-fetch]
description = "Download and verify the pinned fixtures into the shared cache"
run = "/usr/bin/python3 scripts/fetch-fixtures"

[tasks.fixtures-sets]
description = "Rebuild the standard fixture sets from the shared cache"
depends = ["fixtures-fetch"]
run = "/usr/bin/python3 scripts/make-fixture-sets"

[tasks.build-tests]
description = "Build Clove and its test bundles for the iOS Simulator once (build-for-testing)"
run = """
set -eu
xcodebuild build-for-testing \
    -project Clove.xcodeproj \
    -scheme Clove \
    -destination 'generic/platform=iOS Simulator' \
    -derivedDataPath .build/DerivedData.noindex \
    CODE_SIGNING_ALLOWED=NO
"""

[tasks.build-lab]
description = "Build CloveLab for the iOS Simulator"
run = """
set -eu
xcodebuild build \
    -project Clove.xcodeproj \
    -scheme CloveLab \
    -destination 'generic/platform=iOS Simulator' \
    -derivedDataPath .build/DerivedData.noindex \
    CODE_SIGNING_ALLOWED=NO
"""

[tasks.build]
description = "Build Clove (with its test bundles) and CloveLab for the iOS Simulator"
run = """
set -eu
mise run build-tests
mise run build-lab
"""

[tasks.smoke]
description = "Build Clove for testing, then run the app unit tests and the smoke UI test on a throwaway simulator"
depends = ["build-tests"]
run = "./scripts/smoke.sh smoke"

[tasks.ui-flows]
description = "Build Clove for testing, then run the UI flow tests on a throwaway simulator"
depends = ["build-tests"]
run = "./scripts/smoke.sh flows"

[tasks.check]
description = "Quick local check for every fix round: generate, lint, the core and imaging tests, build Clove for testing, the smoke test"
run = """
set -eu
mise run generate
mise run lint
mise run test-core
mise run test-imaging
mise run smoke
"""

[tasks.verify]
description = "The full gate: everything check runs, plus the fixture, release and lab tests, the CloveLab build and the UI flow tests"
run = """
set -eu
mise run generate
mise run lint
mise run test-fixtures
mise run test-release
mise run test-core
mise run test-imaging
mise run test-lab
mise run build-lab
mise run build-tests
# The unit, smoke and flow tests on one simulator, on the build above.
./scripts/smoke.sh all
"""
